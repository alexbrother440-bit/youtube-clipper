<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube Clip Maker</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0f;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:600px;margin:auto;padding:28px 18px}
.card{background:#15151c;border:1px solid #292936;border-radius:20px;padding:22px}
h1{margin:0 0 8px;font-size:28px}
p{color:#aaa;line-height:1.5}
label{display:block;margin:18px 0 7px;font-weight:700}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #383845;background:#0e0e13;color:#fff;font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:12px;background:#fff;color:#000;font-size:16px;font-weight:700}
.msg{margin-top:18px;padding:13px;border-radius:12px;background:#20202a}
a{display:block;text-align:center;margin-top:14px;color:#fff;text-decoration:none}
.small{font-size:12px;color:#777}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>🎬 YouTube Clip Maker</h1>
<p>Potong video menjadi format vertikal 9:16 untuk Shorts/TikTok.</p>

<form method="post">
<label>URL YouTube</label>
<input name="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required>

<div class="row">
<div>
<label>Mulai</label>
<input name="start" value="00:00:00" placeholder="00:00:00">
</div>
<div>
<label>Selesai</label>
<input name="end" value="00:00:30" placeholder="00:00:30">
</div>
</div>

<button type="submit">✂️ Buat Clip 9:16</button>
</form>

{% if message %}
<div class="msg">{{ message }}</div>
{% endif %}

{% if output %}
<a href="/download/{{ output }}">⬇️ Download Clip</a>
{% endif %}

<p class="small">Gunakan hanya video yang kamu miliki atau yang kamu punya izin untuk mengunduh dan mengedit.</p>
</div>
</div>
</body>
</html>
